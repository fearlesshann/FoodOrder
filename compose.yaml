services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/dinner.db
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      UPLOAD_DIR: /data/uploads
    volumes:
      - dinner_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 20s
      timeout: 4s
      start_period: 8s
      retries: 4

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  dinner_data:
